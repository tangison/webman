name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Webman validation gate
        run: python3 validate.py --check-remotes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
